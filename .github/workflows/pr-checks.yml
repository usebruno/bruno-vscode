name: pr checks

on:
  pull_request:

permissions:
  contents: read

# A newer push to the same PR cancels the run it supersedes.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # The @usebruno packages pin each other at exact versions, so a nested copy means
      # a partial update (e.g. Dependabot ran while a release was still being published).
      - name: Check @usebruno packages are not duplicated
        run: |
          NESTED=$(jq -r '.packages | keys[] | select(test("/node_modules/@usebruno/"))' package-lock.json)
          if [ -n "$NESTED" ]; then
            echo "$NESTED"
            echo "::error title=Duplicate @usebruno packages::Nested @usebruno copies in package-lock.json; bump the whole @usebruno set to matching versions"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Package VSIX
        run: npm run package
