name: e2e tests

on:
  push:
    branches:
      - feature/sidebar-native-migration
  workflow_dispatch:

# A second run on the same branch replaces the one in progress.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Electron needs a display; xvfb-run provides a virtual one below.
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb

      - name: Build extension
        run: npm run build

      # The VS Code build the suite runs against lives in .vscode-test/ and is pinned in
      # tests/e2e/utils/vscode-executable.ts; keying on that file re-downloads only on a version bump.
      - name: Cache VS Code download
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('tests/e2e/utils/vscode-executable.ts') }}

      # The OAuth2 specs skip themselves when Keycloak is down; starting it up front keeps its
      # boot time out of the first spec's timeout.
      - name: Start Keycloak
        run: npm run test:keycloak:up

      - name: Run e2e tests
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" npm run test:e2e

      - name: Stop Keycloak
        if: always()
        run: npm run test:keycloak:down

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
          if-no-files-found: ignore

      # Traces from retried tests, plus the screenshots the actions take on failure.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results
            e2e-screenshots
          retention-days: 14
          if-no-files-found: ignore
